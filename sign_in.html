<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone — Demo</title>
    <link rel="stylesheet" href="sign_in.css">
</head>
<body>
    <!-- Header Section -->
    <header>
<div class="nav">
        <div class="top-bar">
            <img src="image/logo1.jpg" alt="main-logo">
        </div>
</div>
    </header>

    <!--Demo Sign In Form -->
    <div class="signin-container">
        <div class="signin-box">
            <h2>Sign-In</h2>
            <form action="" onsubmit="return false;">
                <!-- Username (Email) -->
                <label for="email">Email or mobile phone number</label>
                <div class="input-container">
                    <input type="text" id="email" name="email" required>
                </div>

                <!--Demo Password -->
                <label for="password">Password</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" required>
                </div>

                <!-- Submit Button -->
		<a href="index.html"  class="submit-btn">SIGN IN</a>
                <p>This is a frontend demonstration project inspired by Amazon.
                    It is not affiliated with or operated by Amazon.
                    Do not enter real credentials. <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>

                <div class="help-links">
                    <a href="#">Need help?</a>
                </div>
            </form>

            <div class="new-account">
                <h4>New to Amazon-Clone?</h4>
                <a href="account.html" class="submit-btn">Create Demo Account</a>
            </div>
        </div>
    </div>
</body>
</html>
