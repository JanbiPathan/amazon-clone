<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone — Demo</title>
    <link rel="stylesheet" href="best_seller.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img src="image/logo1.jpg" alt="main-logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for products...">
                <button>Search</button>
            </div>
            <div class="nav-links">
                <a href="index.html">home</a>
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </header>
    <!-- Hero Section -->
    <section class="hero">
        <h1>Discover Best Sellers</h1>
        <p>Find the most popular products in every category!</p>
    </section>
    <!-- Product Grid -->
    <section class="products">
        <h2>Top Picks for You</h2>
        <div class="product-grid">
            <div class="product-card">
                <img src="image/home-decor.jpg" alt="Product 1">
                <h3>Product Name 1</h3>
                <p>$25.00</p>
                <button>View Details</button>
            </div>
            <div class="product-card">
                <img src="image/womenc.jpg" alt="Product 2">
                <h3>Product Name 2</h3>
                <p>$30.00</p>
                <button>View Details</button>
            </div>
            <div class="product-card">
                <img src="image/toyc.jpg" alt="Product 3">
                <h3>Product Name 3</h3>
                <p>$40.00</p>
                <button>View Details</button>
            </div>
            <div class="product-card">
                <img src="image/home storage.jpg" alt="Product 4">
                <h3>Product Name 4</h3>
                <p>$50.00</p>
                <button>View Details</button>
            </div>
        </div>
    </section>
</body>
</html>
