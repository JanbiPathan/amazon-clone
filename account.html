<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone — Demo</title>
    <link rel="stylesheet" href="account.css">
</head>
<body>
    <!-- Header Bar -->
    <header class="header-bar">
        <div class="logo">
            <a href="#">
                <img src="image/logo1.jpg" alt="main-logo">
            </a>
        </div>
    </header>

    <!-- Create Account Form -->
    <div class="container">
        <div class="form-box">
            <h1>Create Account</h1>
            <form action="#" method="POST">
                <label for="name">Your name</label>
                <input type="text" id="name" name="name" placeholder="First and last name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
                <small>Passwords must be at least 6 characters.</small>

                <label for="password-check">Re-enter password</label>
                <input type="password" id="password-check" name="password-check" required>

                <button type="submit" class="create-account-btn"><a href="homepage.html"> your Amazon account</a></button>
            </form>

            <p>By creating an account, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>

            <hr>

            <p>Already have an account? <a href="sing in.html">Sign in</a></p>
        </div>
    </div>
</body>
</html>
