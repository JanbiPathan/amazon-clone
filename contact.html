<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone — Demo</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

   
    <!-- Header Section -->
    <header>
        <div class="top-bar">
            <img src="image/logo1.jpg" alt="main-logo">
            <input type="text" placeholder="Search Amazon.in" class="search-bar">
            <button class="search-button">Search</button>
            <a href="index.html" class="nav-link">home</a>
        </div>
</header>


    <!-- Registration Form -->
    <div class="container">
        <div class="form-header">
            <h2>Create Account</h2>
        </div>
        
        <form action="#" method="POST" enctype="multipart/form-data" class="registration-form">
            <!-- Full Name -->
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="First and last name" required>

            <!-- Email -->
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <!-- Password -->
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>

            <!-- Profile Image -->
            <label for="profile-img">Profile Image</label>
            <input type="file" id="profile-img" name="profile-img" accept="image/*">

            <!-- Submit Button -->
            
	    <a href="C:\Users\BVOC\Desktop\janbi\project2index.html"  class="submit-btn">Create your Amazon account</a>
        </form>

        <p class="terms">
            By creating an account, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.
        </p>
    </div>

</body>
</html>
